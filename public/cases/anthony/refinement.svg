<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#f7f5f0"/><g font-family="Arial,sans-serif" fill="#17202b"><text x="72" y="100" font-size="24">EDITORIAL ILLUSTRATION / PROCESS STUDY</text><text x="72" y="180" font-size="48">Lighter is a drawing problem.</text><text x="72" y="235" font-size="23">A process diagram, not an official font-weight specification.</text><rect x="72" y="310" width="18" height="65" fill="#163b68"/><text x="118" y="336" font-size="28">Input</text><text x="118" y="370" font-size="21">Regular OTFs for Seatren and Sunny Side</text><rect x="72" y="404" width="18" height="65" fill="#2c694a"/><text x="118" y="430" font-size="28">Method</text><text x="118" y="464" font-size="21">Controlled inward adjustments to outlined letters</text><rect x="72" y="498" width="18" height="65" fill="#163b68"/><text x="118" y="524" font-size="28">Constraint</text><text x="118" y="558" font-size="21">Preserve character and João’s spacing work</text><rect x="72" y="592" width="18" height="65" fill="#2c694a"/><text x="118" y="618" font-size="28">Trade-off</text><text x="118" y="652" font-size="21">Lower density requires more optical correction</text><rect x="72" y="686" width="18" height="65" fill="#163b68"/><text x="118" y="712" font-size="28">Next production checks</text><text x="118" y="746" font-size="21">Kerning, joins, small-size and reverse tests</text></g></svg>