<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#f7f5f0"/><g font-family="Arial,sans-serif" fill="#17202b"><text x="72" y="100" font-size="24">EDITORIAL ILLUSTRATION / PROCESS STUDY</text><text x="72" y="180" font-size="48">A point of view becomes a design criterion.</text><text x="72" y="235" font-size="23">Evidence-led exploration in the Anthony Baratta project.</text><rect x="72" y="310" width="18" height="65" fill="#163b68"/><text x="118" y="336" font-size="28">Classic + colorful</text><text x="118" y="370" font-size="21">Preserve character without imitating a room</text><rect x="72" y="404" width="18" height="65" fill="#ae3038"/><text x="118" y="430" font-size="28">Joyful + preppy + smart</text><text x="118" y="464" font-size="21">Evaluate rhythm, contrast and personality</text><rect x="72" y="498" width="18" height="65" fill="#2c694a"/><text x="118" y="524" font-size="28">Pattern grammar</text><text x="118" y="558" font-size="21">Wobble Check and Sawtooth studies moved forward</text><rect x="72" y="592" width="18" height="65" fill="#163b68"/><text x="118" y="618" font-size="28">Typography</text><text x="118" y="652" font-size="21">Seatren and Sunny Side selected for refinement</text><rect x="72" y="686" width="18" height="65" fill="#ae3038"/><text x="118" y="712" font-size="28">Open decisions</text><text x="118" y="746" font-size="21">Final symbol, name and lettering remain unresolved</text></g></svg>