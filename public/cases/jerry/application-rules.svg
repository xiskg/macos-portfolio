<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#f7f5f0"/><g font-family="Arial,sans-serif" fill="#17202b"><text x="72" y="100" font-size="24">EDITORIAL ILLUSTRATION / PROCESS STUDY</text><text x="72" y="180" font-size="48">Recognition through repetition.</text><text x="72" y="235" font-size="23">A schematic of the documented spotlight system, not a campaign deliverable.</text><rect x="72" y="310" width="18" height="65" fill="#12015C"/><text x="118" y="336" font-size="28">Lockup</text><text x="118" y="370" font-size="21">Compact identity at the top</text><rect x="72" y="404" width="18" height="65" fill="#DB8719"/><text x="118" y="430" font-size="28">Message</text><text x="118" y="464" font-size="21">Headline and supporting points</text><rect x="72" y="498" width="18" height="65" fill="#12015C"/><text x="118" y="524" font-size="28">Photography</text><text x="118" y="558" font-size="21">Natural color, separated by a brass rule</text><rect x="72" y="592" width="18" height="65" fill="#DB8719"/><text x="118" y="618" font-size="28">Horizon</text><text x="118" y="652" font-size="21">Rays anchored at the lower edge</text><rect x="72" y="686" width="18" height="65" fill="#12015C"/><text x="118" y="712" font-size="28">Action</text><text x="118" y="746" font-size="21">A consistent brass call to action</text></g></svg>